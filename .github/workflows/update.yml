
name: Aktualizace Duolingo XP

on:
  schedule:
   - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duolingo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stahnout soubory
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nacist XP hracu
        run: python update.py

      - name: Ulozit aktualni vysledky
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizace XP"
            git push
          fi
